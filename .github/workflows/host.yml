name: host

on:
  push:
    paths: ["host/**", "testdata/**", ".github/workflows/host.yml"]
  pull_request:
    paths: ["host/**", "testdata/**", ".github/workflows/host.yml"]

env:
  CARGO_TERM_COLOR: always
  # snapshot mismatches fail instead of writing new files
  INSTA_UPDATE: "no"

defaults:
  run:
    working-directory: host

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: No C libraries through default features
        run: |
          if cargo tree --locked -e features | grep -E -i 'chafa|onig|zstd-sys|dav1d'; then
            echo "a C library came back through default features"; exit 1
          fi

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.98.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      # every test target runs, so one failure does not hide the next
      - run: cargo test --locked --no-fail-fast

  frame-time:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.98.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - run: cargo test --locked --release -p traffic-police-tui --test perf -- --ignored --nocapture
      # ingest from protocol bytes to the store: a 50,000-event replay, then 20,000 events a second
      - run: cargo test --locked --release -p traffic-police-core --test ingest -- --ignored --nocapture

  # cargo-fuzz targets (host/fuzz): each runs a minute; a crash fails the job and its input is
  # kept as an artifact (add it to testdata/fuzz/<target>/ once fixed). Every target runs, also
  # after one crashes (until 2026-10-09 the first crash ended the job)
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host/fuzz
      - run: cargo +nightly install cargo-fuzz --locked
      - name: Fuzz every target
        working-directory: host/fuzz
        run: |
          crashed=""
          for t in $(cargo +nightly fuzz list); do
            echo "::group::$t"
            cargo +nightly fuzz run "$t" -- -max_total_time=60 -rss_limit_mb=2048 || crashed="$crashed $t"
            echo "::endgroup::"
          done
          if [ -n "$crashed" ]; then echo "::error::crashed:$crashed"; exit 1; fi
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: host/fuzz/artifacts
