name: release

# Binaries for Linux, macOS and Windows with the attach-mode agent built in, so they need nothing
# else to attach (ARCHITECTURE.md §4.7.6), and the license texts of everything in them. By hand:
# this run's artifacts. On a v* tag: also a GitHub release, with docs/releases/<tag>.md as notes,
# and the Android libraries in the Maven repository on GitHub Pages.
#
# Nothing is built for release before every check of the host and Android workflows passes
# (lint, tests on three systems, fuzzing, the JVM suites, the sample app), and a tag must name the
# version that the code says (until 2026-10-09 a release ran no tests).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  host-checks:
    uses: ./.github/workflows/host.yml

  android-checks:
    uses: ./.github/workflows/android.yml

  # a tag names the version of the host crates and of the Android libraries, and has notes
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The tag, the code and the notes agree
        run: |
          host=$(sed -n 's/^version = "\(.*\)"$/\1/p' host/Cargo.toml | head -1)
          android=$(sed -n 's/^ *version = "\(.*\)"$/\1/p' android/build.gradle.kts | head -1)
          echo "host $host, Android libraries $android"
          case "$GITHUB_REF" in
            refs/tags/v*)
              tag="${GITHUB_REF_NAME#v}"
              if [ "$host" != "$tag" ] || [ "$android" != "$tag" ]; then
                echo "::error::the tag $GITHUB_REF_NAME does not match the code (host $host, Android $android)"; exit 1
              fi
              if [ ! -s "docs/releases/$GITHUB_REF_NAME.md" ]; then
                echo "::error::docs/releases/$GITHUB_REF_NAME.md is missing"; exit 1
              fi
              ;;
          esac

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # the package list is split on spaces only: one package per line reaches sdkmanager as
      # a single name
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools ndk;28.2.13676358 cmake;3.22.1
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew --stacktrace :attach-agent:agentArtifacts
      - uses: actions/upload-artifact@v7
        with:
          name: agent
          path: android/attach-agent/build/outputs/agent
          if-no-files-found: error

  host:
    needs: [host-checks, android-checks, version, agent]
    strategy:
      fail-fast: false
      matrix:
        include:
          # built against 22.04's glibc (2.35), so it runs on Linux distributions from 2022 on
          - os: ubuntu-22.04
            name: traffic-police-linux-x86_64
            exe: traffic-police
          - os: macos-latest
            name: traffic-police-macos-arm64
            exe: traffic-police
          - os: windows-latest
            name: traffic-police-windows-x86_64.exe
            exe: traffic-police.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: host
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: agent
          path: android/attach-agent/build/outputs/agent
      - run: rustup toolchain install 1.98.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - run: cargo build --release --locked -p traffic-police
        env:
          TRAFFIC_POLICE_EMBED_AGENT: "1"
      # the agent is inside: doctor finds it without the source tree's build output
      - name: The binary carries the agent
        run: |
          rm -rf ../android/attach-agent/build
          ./target/release/${{ matrix.exe }} doctor --mode attach -p io.example 2>&1 | tee doctor.txt || true
          grep -q "agent for attach mode: embedded in this binary" doctor.txt
          mv ./target/release/${{ matrix.exe }} ${{ matrix.name }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: host/${{ matrix.name }}
          if-no-files-found: error
      # the same crates on every platform (the list covers all targets), so once is enough
      - name: The licenses of what the binaries contain
        if: runner.os == 'Linux'
        working-directory: .
        run: python3 host/scripts/third_party_licenses.py > THIRD-PARTY-LICENSES.txt
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: traffic-police-licenses
          path: |
            LICENSE
            THIRD-PARTY-LICENSES.txt
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: host
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: traffic-police-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum traffic-police-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          files: dist/*
          fail_on_unmatched_files: true

  # The Android libraries into the Maven repository on GitHub Pages: the gh-pages branch, under
  # maven/ (https://git-krishnabisht.github.io/traffic-police/maven). A version once published is
  # never replaced.
  library:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: pages
      - name: Not published yet
        run: |
          v="${GITHUB_REF_NAME#v}"
          if [ -e "../pages/maven/io/trafficpolice/capture/$v" ]; then
            echo "::error::io.trafficpolice:capture:$v is already in the Maven repository"; exit 1
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools ndk;28.2.13676358 cmake;3.22.1
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew --stacktrace publishAllPublicationsToPagesRepository "-Ptrafficpolice.pages=$GITHUB_WORKSPACE/pages/maven"
      - name: Onto the gh-pages branch
        working-directory: pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maven
          git commit -m "Maven: the Android libraries ${GITHUB_REF_NAME#v}"
          git push
