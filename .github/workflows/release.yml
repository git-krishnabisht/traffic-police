name: release

# Binaries for Linux, macOS and Windows with the attach-mode agent built in, so they need nothing
# else to attach (ARCHITECTURE.md §4.7.6). By hand: the binaries are this run's artifacts. On a
# v* tag: also a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # its default also asks for "tools", which the SDK repository no longer has; the list is
      # split on spaces only (one package per line reaches sdkmanager as a single name)
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools ndk;28.2.13676358 cmake;3.22.1
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --stacktrace :attach-agent:agentArtifacts
      - uses: actions/upload-artifact@v4
        with:
          name: agent
          path: android/attach-agent/build/outputs/agent
          if-no-files-found: error

  host:
    needs: agent
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: traffic-police-linux-x86_64
            exe: traffic-police
          - os: macos-latest
            name: traffic-police-macos-arm64
            exe: traffic-police
          - os: windows-latest
            name: traffic-police-windows-x86_64.exe
            exe: traffic-police.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: host
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: agent
          path: android/attach-agent/build/outputs/agent
      - run: rustup toolchain install 1.98.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - run: cargo build --release --locked -p traffic-police
        env:
          TRAFFIC_POLICE_EMBED_AGENT: "1"
      # the agent is inside: doctor finds it without the source tree's build output
      - name: The binary carries the agent
        run: |
          rm -rf ../android/attach-agent/build
          ./target/release/${{ matrix.exe }} doctor --mode attach -p io.example 2>&1 | tee doctor.txt || true
          grep -q "agent for attach mode: embedded in this binary" doctor.txt
          mv ./target/release/${{ matrix.exe }} ${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: host/${{ matrix.name }}
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: host
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: traffic-police-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: traffic-police-*
          fail_on_unmatched_files: true
