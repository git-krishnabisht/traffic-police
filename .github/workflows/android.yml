name: android

on:
  # the device job runs the host's end-to-end tests: a change to them runs it too (since 2026-10-16)
  push:
    paths: ["android/**", "testdata/**", ".github/workflows/android.yml", "host/crates/backends/tests/device_e2e.rs"]
  pull_request:
    paths: ["android/**", "testdata/**", ".github/workflows/android.yml", "host/crates/backends/tests/device_e2e.rs"]
  workflow_dispatch:
  # release.yml runs the build job before it builds a release (not the device job)
  workflow_call:
  schedule:
    - cron: "17 3 * * *"

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # the package list is split on spaces only: one package per line reaches sdkmanager as
      # a single name
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools ndk;28.2.13676358 cmake;3.22.1
      - uses: gradle/actions/setup-gradle@v5
      # JVM tests against eight OkHttp versions (protocol goldens included), every artifact, the
      # sample app in all three build types, and the published form of the libraries
      - run: >-
          ./gradlew --stacktrace
          :capture-core:check
          :capture:assembleRelease :capture-noop:assembleRelease :capture:assembleDebugAndroidTest
          :attach-agent:agentArtifacts
          :sample-app:assembleDebug :sample-app:assembleRelease :sample-app:assembleNondebuggable
          :sample-app:assemblePlain
          publishAllPublicationsToBuildRepository
      - name: The published libraries have no third-party runtime dependencies
        run: |
          repo=build/repo/io/trafficpolice
          if grep -q "<dependency>" $repo/capture-core/*/*.pom $repo/capture-noop/*/*.pom; then
            echo "capture-core and capture-noop must have no dependencies"; exit 1
          fi
          others=$(grep -o "<artifactId>[^<]*</artifactId>" $repo/capture/*/capture-*.pom | grep -v -e ">capture<" -e ">capture-core<" || true)
          if [ -n "$others" ]; then echo "capture depends on: $others"; exit 1; fi
      # The release build is minified, as apps' are, and R8 renames what no rule keeps: so besides
      # the names in its dex, R8's mapping (every class kept, under its own name) is read, and
      # both must find capture in nondebuggable, a minified build that ships it on purpose.
      - name: Release builds carry no capture code, and the plain build none of ours at all
        run: |
          in_dex() {
            apk=sample-app/build/outputs/apk/$1/sample-app-$1.apk
            if [ ! -s "$apk" ]; then echo "no $1 APK"; exit 1; fi
            rm -rf "$1-dex"
            unzip -q -o "$apk" 'classes*.dex' -d "$1-dex"
            grep -a -q "Lio/trafficpolice/capture/" "$1"-dex/classes*.dex
          }
          in_mapping() {
            mapping=sample-app/build/outputs/mapping/$1/mapping.txt
            if [ ! -s "$mapping" ]; then echo "no R8 mapping for $1: not minified?"; exit 1; fi
            grep -q "^io\.trafficpolice\.\(capture\|internal\)\." "$mapping"
          }
          if in_dex release || in_mapping release; then
            echo "the release APK contains capture classes"; exit 1
          fi
          if ! in_dex nondebuggable || ! in_mapping nondebuggable; then
            echo "the test does not find the capture classes nondebuggable has"; exit 1
          fi
          apk=sample-app/build/outputs/apk/plain/sample-app-plain.apk
          unzip -q -o "$apk" 'classes*.dex' -d plain-dex
          if grep -a -o "Lio/trafficpolice/[a-z]*/" plain-dex/classes*.dex | grep -v "/sample/"; then
            echo "the plain APK contains traffic-police classes"; exit 1
          fi

  # The sample app on emulators, driven by the host's end-to-end tests: every scenario, both
  # processes, kill and relaunch, the same-uid refusal; and in attach mode the plain build
  # (attach while it runs, --follow, --launch). Slow, so nightly, on demand, and on pushes that
  # change the Android side (since 2026-10-09: a broken device test went unseen for two nights)
  # or the end-to-end tests.
  device:
    if: github.event_name != 'pull_request' && github.workflow == 'android'
    strategy:
      fail-fast: false
      matrix:
        # 27-29 launch with `am start --attach-agent` (30+ with a startup agent, 26 not at all),
        # so they get their own runs; API 27 has no x86_64 image with Google APIs
        api: [26, 27, 28, 29, 36]
        include:
          - api: 27
            target: default
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # the package list is split on spaces only: one package per line reaches sdkmanager as
      # a single name
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools ndk;28.2.13676358 cmake;3.22.1
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew :sample-app:assembleDebug :sample-app:assemblePlain :attach-agent:agentArtifacts :capture:assembleDebugAndroidTest
      - working-directory: host
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - working-directory: host
        run: cargo test --locked -p traffic-police-backends --test device_e2e --no-run
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.target || 'google_apis' }}
          # 4 GB rather than the image's default: on API 36 adb lost the emulator in the middle
          # of the attach test in about half the runs (2026-10-04 to 10-10), and memory is the
          # first suspect
          ram-size: 4096M
          disable-animations: true
          working-directory: host
          # the library's device tests (am instrument exits 0 either way: its report says), then
          # the end-to-end tests one at a time, since both drive the same emulator. A failure in
          # the first does not skip the second (until 2026-10-09 it did): the last line fails the
          # job for it. Each line runs on its own, so the marks are files. After a failed
          # end-to-end test the device's logs are kept (all of logcat's buffers, the kernel's
          # log, tombstones, the adb server's own log) for the artifact below; the device may be
          # coming back from a reconnect, so it is waited for first. logcat keeps 16 MB, so the attach
          # test's lines are still there when a later test fails.
          script: |
            adb logcat -G 16M || true
            adb install -r -t ../android/capture/build/outputs/apk/androidTest/debug/capture-debug-androidTest.apk
            adb shell am instrument -w io.trafficpolice.test/androidx.test.runner.AndroidJUnitRunner > instrumented.txt; cat instrumented.txt; grep -q "^OK (" instrumented.txt || touch instrumented.failed
            adb install -r ../android/sample-app/build/outputs/apk/debug/sample-app-debug.apk
            adb install -r ../android/sample-app/build/outputs/apk/plain/sample-app-plain.apk
            TP_E2E_SERIAL=emulator-5554 cargo test --locked -p traffic-police-backends --test device_e2e -- --ignored --nocapture --test-threads=1 || touch e2e.failed
            if [ -e e2e.failed ]; then mkdir -p device-logs; adb devices -l > device-logs/devices.txt 2>&1; timeout 120 adb -s emulator-5554 wait-for-device; adb -s emulator-5554 logcat -d -b all -v threadtime > device-logs/logcat.txt 2>&1; adb -s emulator-5554 shell su 0 dmesg > device-logs/dmesg.txt 2>&1; adb -s emulator-5554 shell su 0 sh -c 'ls -l /data/tombstones; for t in /data/tombstones/tombstone_*; do echo "== $t"; head -n 200 "$t"; done' > device-logs/tombstones.txt 2>&1; adb -s emulator-5554 shell getprop > device-logs/getprop.txt 2>&1; cp "/tmp/adb.$(id -u).log" device-logs/adb-server.log 2>/dev/null; true; fi
            if [ -e instrumented.failed ]; then echo "::error::the library's device tests failed (their report is above)"; fi; if [ -e e2e.failed ]; then echo "::error::the end-to-end tests failed (their report is above; the device's logs are in the device-logs artifact)"; fi; if [ -e instrumented.failed ] || [ -e e2e.failed ]; then exit 1; fi
      - name: The device's logs, when the end-to-end tests failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: device-logs-api${{ matrix.api }}
          path: host/device-logs/
          if-no-files-found: ignore
          retention-days: 14
