[versions]
agp = "9.4.1"
# the Kotlin that AGP 9.4.1 compiles with (built-in Kotlin); only the sample app uses Kotlin
kotlin = "2.2.10"
# The capture runtime is compiled against the oldest API it supports (docs/research/05 §10):
# OkHttp 3.14.9 with Okio 1.13.0; only ForwardingEventListener sees OkHttp 5.5.0.
okhttp-baseline = "3.14.9"
okio-baseline = "1.13.0"
okhttp-latest = "5.5.0"
okio-latest = "3.18.2"
# gRPC (Phase 5): the interceptor is compiled against the oldest grpc-api it supports; the sample
# app and the newest test suite use the latest
grpc-baseline = "1.21.0"
grpc-latest = "1.84.0"
retrofit = "3.0.0"
coroutines = "1.11.0"
junit = "4.13.2"
androidx-test-runner = "1.7.0"
androidx-test-junit = "1.3.0"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
okhttp-baseline = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp-baseline" }
okio-baseline = { module = "com.squareup.okio:okio", version.ref = "okio-baseline" }
okhttp-latest = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp-latest" }
okhttp-tls = { module = "com.squareup.okhttp3:okhttp-tls", version.ref = "okhttp-latest" }
mockwebserver3 = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp-latest" }
grpc-api-baseline = { module = "io.grpc:grpc-api", version.ref = "grpc-baseline" }
grpc-okhttp = { module = "io.grpc:grpc-okhttp", version.ref = "grpc-latest" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc-latest" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-scalars = { module = "com.squareup.retrofit2:converter-scalars", version.ref = "retrofit" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
