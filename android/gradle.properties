org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
# The capture libraries are Java with no runtime dependencies: do not add kotlin-stdlib to every
# module (AGP 9 built-in Kotlin would). Modules with Kotlin code declare it themselves.
kotlin.stdlib.default.dependency=false
